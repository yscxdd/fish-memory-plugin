name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 单元测试：零依赖、不联网、不启动 DSH（起一个假 ctx 就够）
      - name: unit tests
        run: npm test

      # 包自检：必需文件齐不齐、有没有 BOM、有没有导出 apply
      - name: package self-check
        run: node scripts/memory.mjs verify

      # 宿主口子：17 个口子都有标记、lib/ 里没有越界访问 ctx
      - name: host surface (static)
        run: node scripts/memory.mjs hostcheck

      # 金标召回：20 条改写查询 + 6 条负例；低于 16/20 直接失败
      - name: gold set
        run: node scripts/memory.mjs gold
