name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 先报平台与版本：跨平台差异（例如把 D:/ 这种盘符当绝对路径）一眼能看出来
      # 注意：run 里含 "键: 值" 时必须整体用单引号包住，否则 YAML 会把冒号+空格当映射解析
      - name: environment
        run: 'node -p "JSON.stringify({ platform: process.platform, node: process.version, arch: process.arch })"'

      # 单元测试：零依赖、不联网、不启动 DSH（起一个假 ctx 就够）
      - name: unit tests
        # v0.75.1：输出同时落一份 test.log，失败时下一步把红的名字写成 annotation
        # （拿不到 CI 日志的时候，annotation 是唯一能读到的通道）
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: report failing tests
        if: always()
        shell: bash
        run: |
          if [ -f test.log ]; then
            sum=$(grep -E '^(ℹ|#) (tests|pass|fail|skipped)' test.log | tr '\n' ' ')
            names=$(grep -E '^✖ ' test.log | sed -E 's/[[:space:]]*\([0-9.]+ms\)$//' | head -6 | tr '\n' '|')
            echo "::error title=ci-summary::$sum"
            echo "::error title=failing-names::$names"
          else
            echo "::error title=ci-summary::test.log missing (npm test died before writing)"
          fi


      # 拿不到 job 日志（要 auth）、annotation 又有条数上限，所以最后一条路：
      # 失败时把 test.log 的尾巴推到一个专门的分支，本地 git fetch 就能读
      - name: publish failure log
        if: failure()
        shell: bash
        run: |
          if [ -f test.log ]; then
            mkdir -p .ci
            tail -300 test.log > .ci/test-fail.log
            git config user.name "ci-bot"
            git config user.email "ci-bot@invalid"
            git add -f .ci/test-fail.log
            git commit -m "ci: failure log for ${GITHUB_SHA} on ${RUNNER_OS}" || true
            git push origin HEAD:ci-log --force || true
          fi

      # 包自检：必需文件齐不齐、有没有 BOM、有没有导出 apply
      - name: package self-check
        run: node scripts/memory.mjs verify

      # 宿主口子：17 个口子都有标记、lib/ 里没有越界访问 ctx
      - name: host surface (static)
        run: node scripts/memory.mjs hostcheck

      # 金标召回：20 条改写查询 + 6 条负例；低于 16/20 直接失败
      - name: gold set
        run: node scripts/memory.mjs gold

      # 自审：项目自己的安全规矩（静态、离线、只读）
      - name: self audit
        run: npm run audit

      # 三个时区：v0.50.0 那次 CI 连红三次就是时区写死的（v0.52.2）
      - name: timezone sweep
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 22 }}
        run: node scripts/tz-check.mjs

      # 难题组：会输的尺子（v0.50.0）。当前 70%，退回 50% 以下直接失败
      - name: hard gold set
        run: node scripts/memory.mjs gold --set hard --floor 0.5

      # 规模数字：CHANGELOG 里的「当前规模」必须和磁盘一致（v0.46.1 起不再手写）
      - name: scale numbers
        run: node scripts/scale.mjs --check
