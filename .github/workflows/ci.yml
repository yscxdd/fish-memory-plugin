name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 先报平台与版本：跨平台差异（例如把 D:/ 这种盘符当绝对路径）一眼能看出来
      # 注意：run 里含 "键: 值" 时必须整体用单引号包住，否则 YAML 会把冒号+空格当映射解析
      - name: environment
        run: 'node -p "JSON.stringify({ platform: process.platform, node: process.version, arch: process.arch })"'

      # 单元测试：零依赖、不联网、不启动 DSH（起一个假 ctx 就够）
      # v0.75.1：日志写 $RUNNER_TEMP —— **不能写仓库根**，scale numbers 会数仓库根的文件数
      - id: unit
        name: unit tests
        shell: bash
        run: |
          set +e
          node --test --test-reporter=spec > "$RUNNER_TEMP/test.log" 2>&1
          code=$?
          echo "node --test exit=$code" >> "$RUNNER_TEMP/test.log"
          tail -3 "$RUNNER_TEMP/test.log"
          exit $code

      # 包自检：必需文件齐不齐、有没有 BOM、有没有导出 apply
      - id: verify
        name: package self-check
        run: node scripts/memory.mjs verify

      # 宿主口子：17 个口子都有标记、lib/ 里没有越界访问 ctx
      - id: hostcheck
        name: host surface (static)
        run: node scripts/memory.mjs hostcheck

      # 金标召回：20 条改写查询 + 6 条负例；低于 16/20 直接失败
      - id: gold
        name: gold set
        run: node scripts/memory.mjs gold

      # 自审：项目自己的安全规矩（静态、离线、只读）
      - id: audit
        name: self audit
        run: npm run audit

      # 三个时区：v0.50.0 那次 CI 连红三次就是时区写死的（v0.52.2）
      - id: tz
        name: timezone sweep
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 22 }}
        run: node scripts/tz-check.mjs

      # 难题组：会输的尺子（v0.50.0）。当前 70%，退回 50% 以下直接失败
      - id: hard
        name: hard gold set
        run: node scripts/memory.mjs gold --set hard --floor 0.5

      # 规模数字：CHANGELOG 里的「当前规模」必须和磁盘一致（v0.46.1 起不再手写）
      - id: scale
        name: scale numbers
        run: node scripts/scale.mjs --check

      # 哪一步红了，写进 ci-log 分支（拿 job 日志要 auth，git fetch 不要）
      # 注意：表达式里不能用变量索引 steps.*，所以每一步的 outcome 必须平铺写出
      - name: publish failure log
        if: always()
        shell: bash
        env:
          OUT_UNIT: ${{ steps.unit.outcome }}
          OUT_VERIFY: ${{ steps.verify.outcome }}
          OUT_HOSTCHECK: ${{ steps.hostcheck.outcome }}
          OUT_GOLD: ${{ steps.gold.outcome }}
          OUT_AUDIT: ${{ steps.audit.outcome }}
          OUT_TZ: ${{ steps.tz.outcome }}
          OUT_HARD: ${{ steps.hard.outcome }}
          OUT_SCALE: ${{ steps.scale.outcome }}
        run: |
          failed=""
          for name in unit verify hostcheck gold audit tz hard scale; do
            key="OUT_$(echo "$name" | tr 'a-z' 'A-Z')"
            outcome=$(printenv "$key" || echo unknown)
            if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ]; then
              failed="$failed $name=$outcome"
            fi
          done
          if [ -n "$failed" ]; then
            mkdir -p .ci
            {
              echo "job: $RUNNER_OS / node ${{ matrix.node }}"
              echo "failed:$failed"
              echo "--- test.log tail ---"
              if [ -f "$RUNNER_TEMP/test.log" ]; then tail -25 "$RUNNER_TEMP/test.log"; fi
            } > .ci/test-fail.log
            git config user.name "ci-bot"
            git config user.email "ci-bot@invalid"
            git add -f .ci/test-fail.log
            git commit -m "ci: failure log for ${GITHUB_SHA} on ${RUNNER_OS}" || true
            git push origin HEAD:ci-log --force || true
          fi
